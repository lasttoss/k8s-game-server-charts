{{/*
A chart that can hold a secret is a chart that leaks one: it ends up in a values file in a repository, or
in a Helm release history readable by anyone with get secrets. So this template holds no value at all -
it either finds a Secret that something else manages (an ExternalSecret syncing from a vault, a
sealed-secret, a kubectl create in a break-glass procedure) or it refuses to render, which is a much
better failure than a pod that starts with an empty password and cannot log in.
*/}}
{{- if not .Values.secret.existingSecret }}
{{- fail "secret.existingSecret is empty: name the Secret that holds the database password and the server key (an ExternalSecret is the usual way), rather than putting them in values.yaml" }}
{{- end }}
{{- if not (lookup "v1" "Secret" .Release.Namespace .Values.secret.existingSecret) }}
{{- if .Values.secret.allowMissing }}
{{- else }}
{{- fail (printf "secret %q does not exist in namespace %q: create it first (kubectl create secret, or an ExternalSecret), or set secret.allowMissing=true when rendering the templates outside a cluster" .Values.secret.existingSecret .Release.Namespace) }}
{{- end }}
{{- end }}
